# =====================================================================
# Família Connect — Fluent Bit  (logs -> S3 bronze)
# Os marcadores entre duplo underscore (host, role, bucket, region) são
# substituídos pelo install.sh. As fontes (INPUT) ficam em conf.d/ e
# variam conforme o papel da instância (front/back/ocr/db/bastion).
# =====================================================================

[SERVICE]
    Flush                     5
    Daemon                    Off
    Log_Level                 info
    Parsers_File              parsers.conf
    Parsers_File              parsers_familia.conf
    # buffer em disco: não perde logs se o S3 ficar indisponível
    storage.path              /var/lib/fluent-bit/storage
    storage.sync              normal
    storage.backlog.mem_limit 10M

# INPUTs por papel (copiados pelo install.sh)
@INCLUDE conf.d/*.conf

# =====================================================================
# FILTERS — a ordem importa
# =====================================================================

# 1) Docker: extrai nome do serviço do Swarm (label), container id e
#    limpa o registro (message, stream, service, task, container_id)
[FILTER]
    Name    lua
    Match   docker.raw
    script  /etc/fluent-bit/familia.lua
    call    docker_extract

# 2) Re-tag docker.raw -> docker.<serviço> (front, back, ocr, rabbitmq...)
#    É isso que gera a pasta source=<serviço> no S3.
[FILTER]
    Name                  rewrite_tag
    Match                 docker.raw
    Rule                  $service ^(.+)$ docker.$1 false
    Emitter_Name          re_docker
    Emitter_Storage.type  memory
    Emitter_Mem_Buf_Limit 10M

# 3) nginx (roda dentro do container "front"): parseia o access log
[FILTER]
    Name          parser
    Match         docker.front
    Key_Name      message
    Parser        nginx_access_familia
    Reserve_Data  On
    Preserve_Key  On

# 4) Logs de sistema (syslog tradicional): extrai program/pid
[FILTER]
    Name          parser
    Match_Regex   ^system\.(auth|syslog|kern)$
    Key_Name      message
    Parser        syslog_program
    Reserve_Data  On
    Preserve_Key  On

# 5) Identificação da instância
[FILTER]
    Name    record_modifier
    Match   *
    Record  host __HOST__
    Record  role __ROLE__

# 6) Envelope final padronizado: ts (ISO-8601 UTC), category, source,
#    message (sem \n) — mesmo schema para todas as fontes.
[FILTER]
    Name           lua
    Match          *
    script         /etc/fluent-bit/familia.lua
    call           finalize
    time_as_table  On

# =====================================================================
# OUTPUT — S3 bronze (JSON lines + gzip), particionado estilo Hive
#   s3://<bronze>/logs/category=<cat>/source=<fonte>/dt=<AAAA-MM-DD>/<host>-<HHMMSS>-<uuid>.json.gz
# $TAG[0] = categoria (docker|system|database)
# $TAG[1] = fonte     (front, back, auth, mysql, ...)
# Credenciais: instance profile da EC2 (LabInstanceProfile).
# =====================================================================
[OUTPUT]
    Name                 s3
    Match                *
    region               __REGION__
    bucket               __BUCKET__
    s3_key_format        /logs/category=$TAG[0]/source=$TAG[1]/dt=%Y-%m-%d/__HOST__-%H%M%S-$UUID.json.gz
    total_file_size      20M
    upload_timeout       5m
    use_put_object       On
    compression          gzip
    json_date_key        false
    store_dir            /var/lib/fluent-bit/s3
    store_dir_limit_size 500M
    Retry_Limit          10
