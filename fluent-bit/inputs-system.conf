# Logs do sistema operacional — todas as instâncias.
# "Key message": linha crua vai para o campo "message".

# SSH, sudo, falhas de autenticação (no front inclui o SFTP restrito)
[INPUT]
    Name              tail
    Tag               system.auth
    Path              /var/log/auth.log
    Key               message
    DB                /var/lib/fluent-bit/tail-auth.db
    Read_from_Head    On
    Skip_Long_Lines   On
    Refresh_Interval  10
    Mem_Buf_Limit     5MB
    storage.type      filesystem

