# Instância do banco de dados (MySQL instalado direto no host).
[INPUT]
    Name              tail
    Tag               database.mysql
    Path              /var/log/mysql/error.log
    Key               message
    DB                /var/lib/fluent-bit/tail-mysql.db
    Read_from_Head    On
    Skip_Long_Lines   On
    Refresh_Interval  10
    Mem_Buf_Limit     5MB
    storage.type      filesystem
