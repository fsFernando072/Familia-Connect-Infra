# Parsers próprios (carregados além do parsers.conf padrão do pacote).

# Linha do json-file do Docker: {"log":"...","stream":"stdout","attrs":{...},"time":"..."}
# O evento usa o "time" do Docker como timestamp.
[PARSER]
    Name         docker_json
    Format       json
    Time_Key     time
    Time_Format  %Y-%m-%dT%H:%M:%S.%L
    Time_Keep    Off

# nginx "combined". Nomes diferentes do parser padrão para não colidir
# com o campo "host" (que identifica a instância).
[PARSER]
    Name    nginx_access_familia
    Format  regex
    Regex   ^(?<client_ip>[^ ]*) - (?<remote_user>[^ ]*) \[(?<nginx_time>[^\]]*)\] "(?<method>\S+)(?: +(?<path>[^\"]*?)(?: +\S*)?)?" (?<status>[^ ]*) (?<bytes>[^ ]*)(?: "(?<referer>[^\"]*)" "(?<user_agent>[^\"]*)")?
    Types   status:integer bytes:integer

# syslog tradicional ("Oct  7 20:10:01 host prog[123]: ...") ou ISO-8601
[PARSER]
    Name    syslog_program
    Format  regex
    Regex   ^(?:\d{4}-\d{2}-\d{2}T\S+|[A-Z][a-z]{2}\s+\d+\s+\d{2}:\d{2}:\d{2})\s+\S+\s+(?<program>[^\s\[:]+)(?:\[(?<pid>\d+)\])?:\s
