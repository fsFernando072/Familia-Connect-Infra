# Instâncias que rodam containers (front, back, ocr).
# Cobre nginx (dentro do container "front"), Spring Boot (back),
# OCR e RabbitMQ — tudo via stdout/stderr do Docker (json-file).
# O nome do serviço vem das labels do Swarm (ver /etc/docker/daemon.json).
[INPUT]
    Name              tail
    Tag               docker.raw
    Path              /var/lib/docker/containers/*/*-json.log
    Path_Key          file
    Parser            docker_json
    DB                /var/lib/fluent-bit/tail-docker.db
    Read_from_Head    On
    Skip_Long_Lines   On
    Refresh_Interval  10
    Mem_Buf_Limit     5MB
    storage.type      filesystem

# Logs do próprio daemon Docker (swarm join, falhas de rede overlay etc.)
[INPUT]
    Name              systemd
    Tag               system.dockerd
    Systemd_Filter    _SYSTEMD_UNIT=docker.service
    Read_From_Tail    On
    DB                /var/lib/fluent-bit/systemd-docker.db
    storage.type      filesystem
