[PARSER]
    Name        docker
    Format      json
    Time_Key    time
    Time_Format %Y-%m-%dT%H:%M:%S.%L
    Time_Keep   On

[PARSER]
    Name        mysql_error
    Format      regex
    Regex       ^(?<time>\S+)\s+(?<thread>\d+)\s+\[(?<level>[^\]]+)\]\s+\[(?<code>[^\]]+)\]\s+\[(?<subsystem>[^\]]+)\]\s+(?<message>.*)$
